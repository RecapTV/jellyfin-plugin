name: "RecapTV"
guid: "b3f1b6b0-6f0a-4c8b-9a3d-7c2e4f5a9d10"
version: "0.1.5"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Sync watched movies and episodes from Jellyfin to your RecapTV account."
description: >
  Each Jellyfin user connects their own RecapTV (https://my.recaptv.app) account from
  their profile menu. On completed playback, the plugin reports the watched item to
  RecapTV, which adds it to the user's watchlist and marks it watched (with optional
  backfill of earlier episodes). No server-admin setup beyond installing the plugin
  is required.
category: "General"
owner: "RecapTV"
artifacts:
  - "Jellyfin.Plugin.RecapTV.dll"
changelog: >
  - 0.1.5: register client script injection with the File Transformation plugin
    when installed (now required), falling back to request-time middleware
    otherwise
  - 0.1.4: fix injection script to use request PathBase instead of hardcoded root path
  - 0.1.3: replace RecapTV client settings icon with a more appropriate "live_tv" icon, and remove the old SVG icon.
  - 0.1.2: fix client script injection to use request-time middleware instead of
    rewriting index.html on disk, avoiding permission failures on read-only web
    roots (e.g. some Docker setups).
  - 0.1.1: repository restructure, no functional changes.
  - 0.1.0: initial release - per-user RecapTV connection, playback-complete sync.
