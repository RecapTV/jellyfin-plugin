name: Release plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install jprm
        run: pip install jprm

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin package
        env:
          RECAPTV_API_BASE_URL: ${{ secrets.RECAPTV_API_BASE_URL }}
        run: |
          mkdir -p artifacts
          jprm plugin build . --output ./artifacts --version "${{ steps.version.outputs.version }}" --dotnet-configuration Release

      - name: Locate built zip
        id: zip
        run: echo "name=$(basename ./artifacts/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ steps.zip.outputs.name }}

      - name: Update repository manifest
        run: |
          jprm repo add ./manifest.json "artifacts/${{ steps.zip.outputs.name }}" \
            --plugin-url "https://github.com/RecapTV/jellyfin-plugin/releases/download/${{ github.ref_name }}/${{ steps.zip.outputs.name }}"

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "manifest unchanged" || git commit -m "chore: update plugin manifest for ${{ github.ref_name }}"
          git push origin HEAD:main
