<!DOCTYPE html>
<html>
<head>
  <title>RecapTV</title>
</head>
<body>
  <div id="RecapTVConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
      <div class="content-primary">
        <form id="RecapTVConfigForm">
          <div class="verticalSection">
            <h2>RecapTV</h2>
            <p>
              Users connect their own RecapTV account from their profile menu in the web
              client - nothing to configure per-user here. Override the API base URL only
              if you're pointing this server at a self-hosted or dev RecapTV instance.
            </p>
          </div>
          <div class="inputContainer">
            <label class="inputLabel" for="ApiBaseUrl">RecapTV API base URL</label>
            <input id="ApiBaseUrl" name="ApiBaseUrl" type="text" is="emby-input" />
          </div>
          <div>
            <button is="emby-button" type="submit" class="raised button-submit block">
              <span>Save</span>
            </button>
          </div>
        </form>
      </div>
    </div>
    <script type="text/javascript">
      (function () {
        var PluginId = "b3f1b6b0-6f0a-4c8b-9a3d-7c2e4f5a9d10";

        document.querySelector("#RecapTVConfigPage").addEventListener("pageshow", function () {
          Dashboard.showLoadingMsg();
          ApiClient.getPluginConfiguration(PluginId).then(function (config) {
            document.querySelector("#ApiBaseUrl").value = config.ApiBaseUrl || "";
            Dashboard.hideLoadingMsg();
          });
        });

        document.querySelector("#RecapTVConfigForm").addEventListener("submit", function (e) {
          e.preventDefault();
          Dashboard.showLoadingMsg();
          ApiClient.getPluginConfiguration(PluginId).then(function (config) {
            config.ApiBaseUrl = document.querySelector("#ApiBaseUrl").value.trim();
            ApiClient.updatePluginConfiguration(PluginId, config).then(function (result) {
              Dashboard.processPluginConfigurationUpdateResult(result);
            });
          });
          return false;
        });
      })();
    </script>
  </div>
</body>
</html>
